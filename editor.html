<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anomaly Editor — Night Shift</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { overflow: auto; }
    .ed { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; min-height: 100vh; }
    .ed-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .ed-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .ed select, .ed button { font-family: var(--font); background: #121819; color: var(--text); border: 1px solid var(--line); padding: 6px 10px; border-radius: 3px; cursor: pointer; }
    .ed button:hover { border-color: var(--accent); }
    .ed button.danger:hover { border-color: var(--red); color: var(--red); }
    #edCanvas { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line); cursor: crosshair; touch-action: none; }
    #thumbs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
    .thumb { position: relative; aspect-ratio: 16/9; background: #111 center/cover no-repeat; border: 2px solid var(--line); cursor: pointer; border-radius: 3px; font-size: 11px; }
    .thumb.sel { border-color: var(--accent); }
    .thumb .lbl { position: absolute; left: 3px; top: 2px; text-shadow: 0 0 3px #000; color: #fff; }
    .thumb .tag { position: absolute; right: 3px; bottom: 2px; padding: 0 4px; border-radius: 2px; font-weight: bold; }
    .tag.N { background: #1d5a3a; color: #bff5d6; }
    .tag.A { background: #8a1616; color: #ffd0d0; }
    .thumb.missing { opacity: 0.5; }
    .ed-side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    #edInfo { line-height: 1.6; }
    #edOut { width: 100%; height: 260px; background: #050707; color: var(--text); border: 1px solid var(--line); font-family: var(--font); font-size: 11px; padding: 6px; resize: vertical; }
    .ed-help { color: var(--dim); font-size: 12px; line-height: 1.7; }
    .ed-help b { color: var(--text); }
    .summary { font-size: 12px; color: var(--dim); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="ed">
    <div class="ed-main">
      <div class="ed-bar">
        <select id="edCam"></select>
        <button id="edPrev">◀ Prev</button>
        <button id="edNext">Next ▶</button>
        <button id="edNormal" class="danger">Mark NORMAL (N)</button>
        <span id="edTitle"></span>
      </div>
      <canvas id="edCanvas" width="1280" height="720"></canvas>
      <div id="thumbs"></div>
    </div>

    <aside class="ed-side">
      <div class="panel-title">ANOMALY EDITOR</div>
      <div class="ed-help">
        <b>Drag</b> on the image: start at the anomaly centre, drag outward to set the size.<br />
        Image with a circle = <b>anomaly</b>. No circle = <b>normal</b>.<br />
        <b>← →</b> prev/next image · <b>N</b> mark normal<br />
        Work auto-saves in this browser.
      </div>
      <div id="edInfo"></div>
      <div class="summary" id="edSummary"></div>
      <div class="section-label">EXPORT</div>
      <div class="ed-bar">
        <button id="edDownload">Download anomalies.js</button>
        <button id="edCopy">Copy</button>
        <button id="edReset" class="danger">Reset to file</button>
      </div>
      <div class="ed-help">Save the download as <b>js/anomalies.js</b> (replace the old one).</div>
      <textarea id="edOut" readonly></textarea>
      <a href="index.html" style="color: var(--accent)">← Back to game</a>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/anomalies.js"></script>
  <script src="js/common.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
